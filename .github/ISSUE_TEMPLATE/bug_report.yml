name: Bug report / 错误报告
description: Report reproducible incorrect behavior without private data / 报告可复现问题，请勿包含隐私
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Remove all real accounts, customer details, SMTP credentials, databases, and local user paths.

        感谢反馈。请删除真实账号、客户资料、SMTP 凭据、数据库和本机用户路径。安全漏洞请使用私密报告入口。

  - type: input
    id: version
    attributes:
      label: Version / 版本
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: windows
    attributes:
      label: Windows version / Windows 版本
      options:
        - Windows 11 x64
        - Windows 10 x64
        - Unsupported system / 非支持系统
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened? / 出现了什么问题？
      description: Describe the result and the expected result / 请说明实际结果和预期结果
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      placeholder: |
        1. Open ...
        2. Create fictional example.com data ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots / 已脱敏日志或截图
      description: Optional. Never attach a real database or credential / 可选，绝不要上传真实数据库或凭据

  - type: checkboxes
    id: checks
    attributes:
      label: Privacy check / 隐私确认
      options:
        - label: I removed all private data and secrets / 我已删除所有隐私与凭据
          required: true
        - label: This is not a security vulnerability / 这不是需要私密处理的安全漏洞
          required: true
